<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande confirmée — Aube</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css">
<style>
  .confirm-wrap { max-width: 640px; margin: 0 auto; padding: 60px 28px 100px; }
  .confirm-check { width: 56px; height: 56px; border-radius: 50%; background: var(--wine); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 22px; }
  .confirm-card { background: var(--paper-raised); border: 1px solid var(--line); padding: 28px; margin-top: 28px; }
  .confirm-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .confirm-row:last-child { border-bottom: none; }
  .confirm-items .item-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; color: #4a433c; }
  .confirm-total { font-size: 19px; margin-top: 6px; }
  .test-banner { background: #F1E4CE; color: #7A5A1E; padding: 12px 16px; font-size: 13.5px; margin-bottom: 20px; border-radius: var(--radius); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="logo">Aube</a>
  </div>
</header>

<main class="confirm-wrap" id="confirm-main">
  <p>Chargement de votre commande…</p>
</main>

<script src="/js/confirmation.js"></script>
</body>
</html>
